 --ui-active:#20211f;--ui-quiet:#f4f4f1;--ui-height:36px;
}

 border-radius:var(--ui-radius)!important;box-shadow:none!important;font-weight:750!important;

 text-decoration:none;line-height:1.25;

let imageViewerKeyHandler=null;
function closeImageViewer(){const host=$('#lightboxHost');if(host)host.innerHTML='';if(imageViewerKeyHandler){document.removeEventListener('keydown',imageViewerKeyHandler);imageViewerKeyHandler=null}}
function openImageViewer(photos,startIndex=0,title='圖片預覽'){
 const valid=(photos||[]).filter(x=>x&&x.src);
 if(!valid.length)return;
 let index=Math.max(0,Math.min(startIndex,valid.length-1));
 const host=$('#lightboxHost');
 function paint(){const p=valid[index];host.innerHTML=`<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="${esc(title)}">
   <div class="lightboxHead"><span>${esc(title)} · ${index+1} / ${valid.length}</span><button type="button" class="iconBtn" id="closeLightbox" aria-label="關閉大圖">${icon('close')}</button></div>
   <div class="lightboxStage"><button type="button" class="iconBtn imageArrow" id="prevImage" aria-label="上一張">${icon('left')}</button><img id="lightboxImage" src="${esc(p.src)}" alt="${esc(p.caption||title)}"><button type="button" class="iconBtn imageArrow" id="nextImage" aria-label="下一張">${icon('right')}</button></div>
   <div class="lightboxCaption">${esc(p.caption||'')}</div></div>`;
  $('#closeLightbox').onclick=closeImageViewer;
  $('#prevImage').onclick=()=>{index=(index-1+valid.length)%valid.length;paint()};
  $('#nextImage').onclick=()=>{index=(index+1)%valid.length;paint()};
  $('#lightbox').onclick=e=>{if(e.target.id==='lightbox')closeImageViewer()};
  let sx=null;$('#lightboxImage').ontouchstart=e=>{sx=e.touches[0].clientX};$('#lightboxImage').ontouchend=e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55){index=(index+(dx<0?1:-1)+valid.length)%valid.length;paint()}sx=null};
 }
 closeImageViewer();paint();
 imageViewerKeyHandler=e=>{if(e.key==='Escape')closeImageViewer();if(e.key==='ArrowLeft'){index=(index-1+valid.length)%valid.length;paint()}if(e.key==='ArrowRight'){index=(index+1)%valid.length;paint()}};
 document.addEventListener('keydown',imageViewerKeyHandler);
}

function openEditor(id=null){const item=id?data.items.find(x=>x.id===id):null;openModal(editorHTML(item));$('#closeModal').onclick=$('#cancelEdit').onclick=closeModal;$('#editorForm').onsubmit=e=>{e.preventDefault();const title=$('#fTitle').value.trim(),body=$('#fBody').value.trim(),city=$('#fCity').value.trim(),country=$('#fCountry').value||inferCountry(`${title} ${body} ${city}`),category=$('#fCategory').value||inferCategory(`${title} ${body}`),products=$('#fProducts').value.split('\n').map(x=>x.trim()).filter(Boolean),images=$('#fImages').value.split('\n').map(x=>x.trim()).filter(Boolean),tags=$('#fTags').value.split(',').map(x=>x.trim()).filter(Boolean),productImages={};products.forEach((p,idx)=>{if(images[idx])productImages[p]=images[idx]});const obj=normalizeItem({...(item||{}),id:item?.id||uid(),title,body,city,country,category,products,images,productImages,tags,platform:$('#fPlatform').value,url:$('#fUrl').value.trim(),shoppingType:$('#fShoppingType').value.trim(),note:$('#fNote').value,address:extractAddress(body),summary:body.replace(/\s+/g,' ').slice(0,150),terms:uniq([title,...products,...tags]).slice(0,15),createdAt:item?.createdAt||Date.now()});if(item)Object.assign(item,obj);else data.items.unshift(obj);save();closeModal();render()}}
function openShoppingListModal(ids,presetProducts=null){

 </form>`);
 let mode='new';

// Demo art is only used when the remote example photo cannot load.
// It is explicitly labeled illustrative and never saved over the original image URL.
function imageFallbackData(label='圖片',originalUrl=''){
 const isExample=String(originalUrl).includes('images.unsplash.com');
 const seed=[...String(label+originalUrl)].reduce((sum,c)=>sum+c.charCodeAt(0),0);
 const colors=[['#e7e2d8','#bfc6b6'],['#e4e4dc','#b7c4c9'],['#eee1dc','#d3b7ad'],['#e7e3ef','#bcb6ce']][seed%4];
 const safeLabel=esc(String(label).replace(/範例|文章預覽圖片/g,'').trim()||'收藏圖片').slice(0,42);
 const lines=safeLabel.match(/.{1,18}/g)||['收藏圖片'];
 const art=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs><linearGradient id="g" x2=".85" y2="1"><stop stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[1]}"/></linearGradient></defs>
  <rect width="900" height="600" fill="url(#g)"/><circle cx="685" cy="125" r="140" fill="#ffffff" opacity=".2"/>
  <ellipse cx="450" cy="465" rx="170" ry="23" fill="#34332f" opacity=".13"/>
  <rect x="350" y="115" width="200" height="340" rx="22" fill="#fafaf8" stroke="#c9c9c3" stroke-width="3"/>
  <rect x="385" y="90" width="130" height="35" rx="7" fill="#4a514f"/>
  <rect x="370" y="210" width="160" height="150" rx="4" fill="#e8e8e1"/>
  <path d="M395 245h110M395 270h110M395 295h82" stroke="#b7b8ae" stroke-width="4"/>
  <text x="450" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#5b5f58">COLLECTION</text>
  <rect x="20" y="496" width="860" height="86" rx="15" fill="#ffffff" opacity=".88"/>
  ${lines.slice(0,2).map((line,idx)=>`<text x="450" y="${527+idx*28}" font-family="Arial,Noto Sans CJK TC,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#31332e">${esc(line)}</text>`).join('')}
  <text x="865" y="28" text-anchor="end" font-family="Arial,Noto Sans CJK TC,sans-serif" font-size="15" fill="#555b54">${isExample?'範例示意圖':'圖片無法載入'}</text>
 </svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(art)
}
document.addEventListener('error',e=>{

 const source=im.currentSrc||im.src||'';
 const title=im.getAttribute('alt')||im.closest('.card')?.querySelector('.title')?.textContent||'收藏圖片';
 im.src=imageFallbackData(title,source);
},true);
