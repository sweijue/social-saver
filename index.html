/* v1.5.1 / consistent mobile interaction system */

 --ui-radius:10px;--ui-border:#d8d9d5;--ui-bg:#ffffff;--ui-fg:#20211f;
 --ui-active:#20211f;--ui-quiet:#f4f4f1;--ui-height:36px;
}

.form :is(input:not([type="checkbox"]),textarea,select){border:1px solid var(--ui-border);border-radius:var(--ui-radius);font-weight:500}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #5c665e;outline-offset:2px}

 box-sizing:border-box;border:1px solid var(--ui-border)!important;background:var(--ui-bg)!important;color:var(--ui-fg)!important;
 border-radius:var(--ui-radius)!important;box-shadow:none!important;font-weight:750!important;
 display:inline-flex;align-items:center;justify-content:center;gap:5px;

  b.addEventListener('pointerdown',e=>{if(e.button!==0)return;triggered=false;startX=e.clientX;startY=e.clientY;clear();timer=setTimeout(()=>{triggered=true;b.dataset.longActivated='1';openTaxonomyManager(kind,value);},550)});
  b.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)clear()});

 });

function taxonomyStoreKey(kind){return {category:'customCategories',tag:'customTags',country:'customCountries'}[kind]}
function openTaxonomyManager(initialKind='category',initialValue='',directAdd=false){
 closeDrawer();
 const group=(kind,label)=>`<div class="taxGroup" data-tax-group="${kind}"><div class="taxHeading"><strong>${label}</strong><button type="button" class="uiBtn" data-tax-create="${kind}" aria-label="新增${label}">${icon('plus')}</button></div>
 <div id="tax-${kind}">${taxonomyValues(kind).map(v=>`<div class="taxEntry"><span class="taxEntryName">${esc(v)}</span><span class="taxEntryCount">${kind==='category'?data.items.filter(x=>x.category===v).length:kind==='country'?data.items.filter(x=>x.country===v).length:data.items.filter(x=>(x.tags||[]).includes(v)).length} 篇</span><button type="button" class="uiBtn" data-tax-edit="${kind}" data-tax-value="${esc(v)}" aria-label="編輯 ${esc(v)}">${icon('edit',15)}</button><button type="button" class="uiBtn" data-tax-remove="${kind}" data-tax-value="${esc(v)}" aria-label="刪除 ${esc(v)}">${icon('trash',15)}</button></div>`).join('')}</div></div>`;
 openModal(`<div class="sheetHead"><strong>管理分類／國家／標籤</strong><button class="iconBtn uiBtn" id="closeModal" aria-label="關閉">${icon('close')}</button></div>
 <div class="form" id="taxContent"><p class="taxHint">直接點 ＋ 新增；點鉛筆可在原位置改名，刪除時會先確認。</p>${group('category','分類')}${group('country','國家')}${group('tag','標籤')}</div>`);
 $('#closeModal').onclick=closeModal;
 function saveTax(kind,oldValue,newValue,action){
  const key=taxonomyStoreKey(kind),before=taxonomyValues(kind),after=(newValue||'').trim();
  if(action!=='delete'&&!after){alert('請輸入名稱');return false}
  if(action!=='delete'&&after!==oldValue&&before.includes(after)){alert('這個名稱已存在');return false}
  if(action==='delete'&&!confirm(`確定刪除「${oldValue}」？相關收藏也會同步調整。`))return false;
  if(action==='add')data[key]=uniq([...(data[key]||[]),after]);
  if(action==='rename')data[key]=uniq((data[key]||[]).map(t=>t===oldValue?after:t).concat([after]));
  if(action==='delete')data[key]=(data[key]||[]).filter(t=>t!==oldValue);
  data.items.forEach(item=>{
   if(kind==='category'&&item.category===oldValue)item.category=action==='delete'?'其他':after;
   if(kind==='country'&&item.country===oldValue)item.country=action==='delete'?'其他':after;
   if(kind==='tag')item.tags=(item.tags||[]).flatMap(t=>t!==oldValue?[t]:(action==='delete'?[]:[after]));
  });
  if(kind==='category'&&categoryFilter===oldValue)categoryFilter=action==='delete'?'全部':after;
  if(kind==='country'&&countryFilter===oldValue)countryFilter=action==='delete'?'全部':after;
  if(kind==='tag'&&tagFilter===oldValue)tagFilter=action==='delete'?'全部':after;
  save();render();openTaxonomyManager(kind);return true
 }

  const form=document.createElement('form');form.className='taxInline';
  form.innerHTML=`<input aria-label="${adding?'新增':'編輯'}名稱" maxlength="72" placeholder="輸入名稱" value="${esc(oldValue)}"><button type="submit" class="uiBtn">儲存</button><button type="button" class="uiBtn taxCancel">取消</button>`;
  target.insertAdjacentElement('afterend',form);
  form.querySelector('.taxCancel').onclick=()=>form.remove();
  form.onsubmit=e=>{e.preventDefault();saveTax(kind,oldValue,form.querySelector('input').value,adding?'add':'rename')};
  const input=form.querySelector('input');input.focus();input.select();
 }
 $$('[data-tax-create]').forEach(b=>b.onclick=()=>editInline(b.dataset.taxCreate,'',true));
 $$('[data-tax-edit]').forEach(b=>b.onclick=()=>editInline(b.dataset.taxEdit,b.dataset.taxValue,false));
 $$('[data-tax-remove]').forEach(b=>b.onclick=()=>saveTax(b.dataset.taxRemove,b.dataset.taxValue,'','delete'));
 if(directAdd)editInline(initialKind,'',true);
 else if(initialValue)editInline(initialKind,initialValue,false);
}

function platformFromURL(url){
 try{const host=new URL(url).hostname.toLowerCase().replace(/^www\./,'');
   if(host.includes('instagram.com'))return'Instagram';if(host.includes('threads.net')||host.includes('threads.com'))return'Threads';
   if(host.includes('facebook.com')||host.includes('fb.watch'))return'Facebook';
   if(host.includes('xiaohongshu.com')||host.includes('xhslink.com'))return'小紅書';
   if(host.includes('youtube.com')||host.includes('youtu.be'))return'YouTube';
   if(host.includes('tiktok.com'))return'TikTok';
   if(host==='x.com'||host==='twitter.com'||host.endsWith('.x.com'))return'X';
 }catch{}return'網頁';
}
function cleanExternalURL(url){
 try{const u=new URL(String(url||'').trim());return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}
}
function isGenericPreview(title,platform){
 const s=String(title||'').trim().toLowerCase();
 return !s||[platform.toLowerCase(),'instagram','threads','facebook','小紅書','x','tiktok','youtube','login • instagram'].includes(s)||/^log in (to|or)/.test(s)||/@[a-z0-9_.]+.*\bon\s+(threads|instagram|facebook)\b/i.test(s)||/\bon\s+(threads|instagram|facebook)\s*$/.test(s)
}
async function fetchPublicMetadata(url){
 // External public preview API; no secret token is bundled with this static GitHub Pages app.
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),13000);
 try{
  const res=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url),{signal:ctl.signal,cache:'no-store'});
  if(!res.ok)throw new Error(res.status===429?'公開預覽服務已達次數限制':`預覽服務回應 ${res.status}`);
  const json=await res.json();if(json.status!=='success'||!json.data)throw new Error(json.message||'無法取得文章公開資訊');
  const d=json.data,platform=platformFromURL(url);
  const title=String(d.title||'').trim(),description=String(d.description||'').trim();
  const cover=cleanExternalURL(d.image?.url||'');const previewImages=uniq([cover,...(Array.isArray(d.images)?d.images.map(x=>cleanExternalURL(typeof x==='string'?x:x?.url||'')):[])]).filter(Boolean);
  if(isGenericPreview(title,platform)&&!description&&!cover)throw new Error('來源平台限制，沒有公開文章資訊');
  return {title:!isGenericPreview(title,platform)?title:'',body:description,images:previewImages,author:String(d.author||'').trim(),date:d.date||null};
 }finally{clearTimeout(timer)}
}
function quickFallbackTitle(url){

}
function detectProductCandidates(text){
 // Only a tiny explicit list after "推薦：" etc.; no claim to full AI extraction.
 const m=String(text||'').match(/(?:推薦(?:清單|商品|三樣|幾樣)?|必買(?:清單)?|商品(?:包含|包括)?)[^：:\n]{0,16}[：:]\s*([^。.!?\n]{6,220})/i);
 if(!m)return[];
 const parts=m[1].split(/[、，,；;]/).map(x=>x.trim().replace(/[。.!?]+$/,'')).filter(x=>x.length>2&&x.length<90);
 return uniq(parts).slice(0,8)
}
function guessTags(text,country,category){
 const tags=[country,category].filter(x=>x!=='其他');
 const rules=[['Olive Young',/Olive Young|올리브영/i],['弘大',/弘大|홍대|Hongdae/i],['聖水',/聖水|성수/i],['美妝',/美妝|氣墊|防曬|cushion|serum/i],['咖啡',/咖啡|카페|cafe/i]];
 rules.forEach(([tag,rx])=>{if(rx.test(text))tags.push(tag)});return uniq(tags)
}
function quickItem(url,meta,fields={}){

 const content=[title,body].join(' ');
 const country=inferCountry(content),category=inferCategory(content);
 const products=fields.products?.length?fields.products:detectProductCandidates(body);
 const articleImages=uniq([...(meta?.images||[]),...(fields.images||[])]);
 const productImages={};
 // Only user supplied one-to-one images qualify as mapped product images.
 if(fields.images?.length && fields.images.length===products.length)products.forEach((p,idx)=>productImages[p]=fields.images[idx]);
 const quality=fields.body?'manual':meta?'preview':'linkOnly';const placeName=fields.placeName||findPlaceName(body,title);const address=fields.address||extractAddress(body);

  terms:makeSearchTerms({placeName,address,products,body,country}),
  summary:body?body.replace(/\s+/g,' ').slice(0,165):'尚未讀到文章內容；已先保留原始連結。',
  sourceQuality:quality,sourceCapturedAt:Date.now(),createdAt:Date.now(),status:category==='購物'?'想買':'剛收藏'
 })
}

  const ids=new Set(target.map(x=>x.id));
  for(const item of (local?.[key]||[])){
   if(!ids.has(item.id)){target.push({...item});ids.add(item.id)}

  }else if(latest.revision!==cloudMeta.revision){
   if(latest.data){data=loadData(latest.data);await writeStore(data);render()}
   cloudMeta.revision=latest.revision;persistCloud();
  }
  const inbox=await cloudRequest('GET','/api/inbox');
  const rows=Array.isArray(inbox.items)?inbox.items:[];
  const already=new Set(data.items.map(i=>i.url).filter(Boolean));
  let added=0;
  for(const msg of rows){
   const url=cleanExternalURL(msg.url);if(!url||already.has(url))continue;
   let meta=null;
   try{meta=await fetchPublicMetadata(url)}catch{} // blocked social links remain URL-only
   const sharedText=String(msg.shared_text||'').replace(url,'').trim();
   const item=quickItem(url,meta,(!meta&&sharedText.length>8)?{body:sharedText}:{});
   item.inboxId=msg.id;data.items.unshift(item);already.add(url);added++;
  }
  if(added){await writeStore(data);cloudMeta.dirty=true;persistCloud();await cloudCommit();render()}
  if(rows.length)await cloudRequest('POST','/api/inbox/ack',{ids:rows.map(x=>x.id)});
  cloudMessage=added?`已同步，新增 ${added} 篇分享`:'雲端已同步';cloudStatusUI();
 }catch(e){cloudMessage=`同步失敗：${e.message}`;cloudStatusUI();}
 finally{cloudBusy=false}
}
async function cloudBoot(){
 if(!cloudConfig)return;
 if(!cloudConfig.url||!cloudConfig.token){cloudConfig=null;return}
 await cloudRun();
 if(!cloudTimer)cloudTimer=setInterval(()=>{if(document.visibilityState==='visible')cloudRun()},35000);
}
async function cloudConnect(url,token){
 const config={url:cloudServerURL(url),token:String(token||'').trim()};
 if(config.token.length<32)throw new Error('請填至少 32 字元的 Worker 密鑰');
 const remote=await cloudRequest('GET','/api/state',undefined,config);
 // Explicit initial merge keeps previously saved local favorites and lists.
 if(remote.data?.items?.length||remote.data?.shoppingLists?.length||remote.data?.travelPlans?.length){
  if(!confirm('雲端已有資料。要將這台裝置的收藏和清單加入雲端嗎？相同 ID 將以雲端為準。'))return false;
  data=loadData(cloudMerge(remote.data,data));
 }
 cloudConfig=config;
 cloudMeta={revision:remote.revision,dirty:true,wasConnected:true};persistCloud();
 try{localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig))}
 catch{throw new Error('此瀏覽器無法保存連線設定')}
 await writeStore(data);
 await cloudCommit();cloudConflict=false;render();
 if(!cloudTimer)cloudTimer=setInterval(()=>{if(document.visibilityState==='visible')cloudRun()},35000);
 await cloudRun();return true;
}
function openCloudSettings(){
 const active=!!cloudConfig;
 openModal(`<div class="sheetHead"><strong>雲端同步</strong><button class="iconBtn uiBtn" id="closeCloud" aria-label="關閉">${icon('close')}</button></div>
 <div class="form">
  <p class="cloudHelp">手機分享捷徑直接送到 Worker；拾集開啟時自動讀取。密鑰只保存在你這台裝置，不寫入 GitHub。</p>
  <label>Cloudflare Worker 網址<input type="url" id="cloudUrl" autocomplete="off" placeholder="https://shiji-sync.你的帳號.workers.dev" value="${esc(cloudConfig?.url||'')}"></label>
  <label>私密同步密鑰<input type="password" id="cloudToken" autocomplete="off" placeholder="Worker Secret：SJ_TOKEN" value="${esc(cloudConfig?.token||'')}"></label>
  <p class="cloudHelp" id="cloudDialogStatus">${esc(cloudMessage)}</p>
  <div class="formActions cloudActions"><button type="button" class="ghost uiBtn" id="cancelCloud">取消</button><button type="button" class="primary uiBtn" id="connectCloud">${active?'重新連線':'開始連線'}</button></div>
  ${active?`<div class="formActions"><button type="button" class="ghost uiBtn" id="syncCloudNow">立即同步</button><button type="button" class="ghost uiBtn" id="cloudPullForce">改用雲端資料</button><button type="button" class="ghost uiBtn" id="cloudPushForce">以本機覆蓋雲端</button><button type="button" class="ghost uiBtn" id="disconnectCloud">斷開</button></div>`:''}
 </div>`);
 $('#closeCloud').onclick=$('#cancelCloud').onclick=closeModal;
 $('#connectCloud').onclick=async()=>{
  const btn=$('#connectCloud');btn.disabled=true;
  $('#cloudDialogStatus').textContent='檢查連線中…';
  try{const ok=await cloudConnect($('#cloudUrl').value,$('#cloudToken').value);if(ok)closeModal();else $('#cloudDialogStatus').textContent='已取消合併'}
  catch(e){$('#cloudDialogStatus').textContent=`連線失敗：${e.message}`}
  finally{btn.disabled=false}
 };
 if(!active)return;
 $('#syncCloudNow').onclick=async()=>{cloudConflict=false;closeModal();await cloudRun();if(cloudMessage.startsWith('同步失敗'))alert(cloudMessage)};
 $('#cloudPullForce').onclick=async()=>{
  if(!confirm('將這台裝置目前的資料改為雲端版本。請先匯出本機備份，確定嗎？'))return;
  try{const r=await cloudRequest('GET','/api/state');if(r.data){exportData();data=loadData(r.data);await writeStore(data);render()}
   cloudMeta={revision:r.revision,dirty:false,wasConnected:true};persistCloud();cloudConflict=false;cloudMessage='已從雲端取回';closeModal();cloudStatusUI()}
  catch(e){alert(e.message)}
 };
 $('#cloudPushForce').onclick=async()=>{
  if(!confirm('這會用本機資料覆蓋其他裝置的雲端變更。建議先匯出備份。確定嗎？'))return;
  try{const r=await cloudRequest('GET','/api/state');cloudMeta.revision=r.revision;cloudMeta.dirty=true;persistCloud();cloudConflict=false;await cloudCommit();closeModal()}
  catch(e){alert(e.message)}
 };
 $('#disconnectCloud').onclick=()=>{
  if(!confirm('斷開雲端？本機資料會保留，但不再同步。'))return;
  try{localStorage.removeItem(CLOUD_CONFIG_KEY);localStorage.removeItem(CLOUD_META_KEY)}catch{}
  cloudConfig=null;cloudMeta={revision:null,dirty:false,wasConnected:false};cloudConflict=false;
  if(cloudTimer){clearInterval(cloudTimer);cloudTimer=null}
  cloudMessage='尚未設定雲端';closeModal();cloudStatusUI()
 };
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudConfig)cloudRun()});
window.addEventListener('online',()=>{if(cloudConfig)cloudRun()});

</script>
