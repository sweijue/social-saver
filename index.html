function drawerHTML(){const cats=['全部',...uniq(data.items.map(i=>i.category))],countries=categoryFilter==='全部'?[]:['全部',...uniq(data.items.filter(i=>i.category===categoryFilter).map(i=>i.country))],tags=countryFilter==='全部'?[]:['全部',...uniq(data.items.filter(i=>(categoryFilter==='全部'||i.category===categoryFilter)&&(countryFilter==='全部'||i.country===countryFilter)).flatMap(i=>i.tags||[]))];return`<div class="drawerBackdrop" id="drawerBackdrop"></div><aside class="drawer"><div class="drawerHead"><strong>選單</strong><button class="xBtn" id="closeDrawer">×</button></div><div class="drawerTitle">篩選收藏</div><div class="filterLevel"><div class="filterLabel">1. 分類</div><div class="chips">${cats.map(x=>`<button class="chip ${categoryFilter===x?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>${categoryFilter!=='全部'?`<div class="filterLevel"><div class="filterLabel">2. 國家</div><div class="chips">${countries.map(x=>`<button class="chip ${countryFilter===x?'active':''}" data-country="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}${categoryFilter!=='全部'&&countryFilter!=='全部'?`<div class="filterLevel"><div class="filterLabel">3. 標籤</div><div class="chips">${tags.map(x=>`<button class="chip ${tagFilter===x?'active':''}" data-tag="${esc(x)}">${x==='全部'?'全部':'# '+esc(x)}</button>`).join('')}</div></div>`:''}<div class="drawerSection"><div class="drawerTitle">資料工具</div><div class="toolRow"><button class="smallBtn" id="exportBtn">匯出備份</button><button class="smallBtn" id="importBtn">匯入備份</button><button class="smallBtn" id="resetFilter">清除篩選</button></div></div><div class="drawerSection"><div class="filterLabel">目前版本</div><strong>v${VERSION}</strong></div></aside>`}
function openDrawer(){$('#drawerHost').innerHTML=drawerHTML();$('#closeDrawer').onclick=$('#drawerBackdrop').onclick=closeDrawer;$$('[data-cat]').forEach(b=>b.onclick=()=>{categoryFilter=b.dataset.cat;countryFilter='全部';tagFilter='全部';openDrawer();render()});$$('[data-country]').forEach(b=>b.onclick=()=>{countryFilter=b.dataset.country;tagFilter='全部';openDrawer();render()});$$('[data-tag]').forEach(b=>b.onclick=()=>{tagFilter=b.dataset.tag;openDrawer();render()});$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#resetFilter').onclick=()=>{categoryFilter=countryFilter=tagFilter='全部';openDrawer();render()}}
function closeDrawer(){$('#drawerHost').innerHTML=''}
function openModal(html){

function openDetail(id){detailIds=detailOrder().map(i=>i.id);if(!detailIds.includes(id))detailIds=allSorted().map(i=>i.id);detailIndex=Math.max(0,detailIds.indexOf(id));renderDetail()}
function renderDetail(){
 const i=data.items.find(x=>x.id===detailIds[detailIndex]);
 if(!i)return closeModal();
 const q=encodeURIComponent(i.address||i.title),nq=encodeURIComponent(`${i.title} ${i.address||''}`);
 openModal(`<div class="sheetHead">

 </div>
 ${i.images?.length?`<div class="detailGallery">${i.images.map(src=>`<img src="${esc(src)}" alt="">`).join('')}</div>`:''}
 <button class="detailSideNav left uiBtn" id="prevDetail">‹</button><button class="detailSideNav right uiBtn" id="nextDetail">›</button>
 <div class="detailBody">

   ${i.url?`<div class="detailSection"><a class="linkPill uiBtn" href="${esc(i.url)}" target="_blank" rel="noopener">↗ 原文章</a></div>`:''}
   <div class="detailSection"><h4>原始文章內容</h4><div class="bodyText originalBody">${esc(i.body)}</div></div>
   <div class="detailSection"><h4>整理摘要</h4><div class="bodyText">${esc(i.summary)}</div></div>
   ${i.products?.length?`<div class="detailSection">
      <div class="productSectionHead"><h4>商品與圖片</h4><span>可逐項勾選加入購物清單</span></div>
      <div class="productGrid">${i.products.map((p,idx)=>{const im=productImage(i,p,idx);return`<label class="productCard selectableProduct">${im?`<img src="${esc(im)}" alt="">`:'<div class="productImgPh">沒有圖片</div>'}<div class="productCardText"><input type="checkbox" class="detailProductCheck" data-product="${esc(p)}" checked><span class="productName">${esc(p)}</span></div></label>`}).join('')}</div>
      <button class="primary uiBtn productAddBtn" id="detailAddShop">加入所選商品到購物清單</button>
   </div>`:''}
   ${i.address?`<div class="detailSection"><h4>地點</h4><div class="bodyText">${esc(i.address)}</div><a class="linkPill uiBtn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank">Google Maps</a>${i.country==='韓國'?`<a class="linkPill uiBtn" href="https://map.naver.com/p/search/${nq}" target="_blank">NAVER Map</a>`:''}</div>`:''}
   <div class="detailSection"><h4>可搜尋文字</h4><div class="tagRow">${(i.terms||[]).map(t=>`<button class="termBtn uiBtn" data-copy="${esc(t)}">${esc(t)} ⧉</button>`).join('')}</div></div>
   <div class="detailSection"><h4>標籤</h4><div class="tagRow">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>
   <div class="detailSection noteBox"><h4>我的備註</h4><textarea id="noteInput" placeholder="自己的想法、是否值得去、下次要買什麼…">${esc(i.note||'')}</textarea><div class="formActions"><button class="ghost uiBtn" id="saveNote">儲存備註</button></div></div>
 </div>`);
 $('#closeModal').onclick=closeModal;
 $('#editDetail').onclick=()=>openEditor(i.id);
 $('#deleteDetail').onclick=()=>{if(confirm('確定刪除這篇收藏？')){data.items=data.items.filter(x=>x.id!==i.id);selected.delete(i.id);save();detailIds=detailIds.filter(x=>x!==i.id);if(!detailIds.length){closeModal();render()}else{detailIndex=Math.min(detailIndex,detailIds.length-1);renderDetail();render()}}};
 $('#prevDetail').onclick=()=>{detailIndex=(detailIndex-1+detailIds.length)%detailIds.length;renderDetail()};
 $('#nextDetail').onclick=()=>{detailIndex=(detailIndex+1)%detailIds.length;renderDetail()};
 $('#saveNote').onclick=()=>{i.note=$('#noteInput').value;save();$('#saveNote').textContent='已儲存 ✓'};
 if($('#detailAddShop'))$('#detailAddShop').onclick=()=>{
   const chosen=$$('.detailProductCheck').filter(x=>x.checked).map(x=>x.dataset.product);
   if(!chosen.length){alert('請至少勾選一個商品');return}
   openShoppingListModal([i.id],chosen)
 };
 $$('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已複製 ✓'}catch{prompt('複製這段文字',b.dataset.copy)}});
 let sx=null;
 $('#sheet').ontouchstart=e=>{sx=e.touches?.[0]?.clientX??null};
 $('#sheet').ontouchend=e=>{if(sx==null)return;const dx=(e.changedTouches?.[0]?.clientX??sx)-sx;if(Math.abs(dx)>80){detailIndex=(detailIndex+(dx<0?1:-1)+detailIds.length)%detailIds.length;renderDetail()}sx=null}
}
function openEditor(id=null){const item=id?data.items.find(x=>x.id===id):null;openModal(editorHTML(item));$('#closeModal').onclick=$('#cancelEdit').onclick=closeModal;$('#editorForm').onsubmit=e=>{e.preventDefault();const title=$('#fTitle').value.trim(),body=$('#fBody').value.trim(),city=$('#fCity').value.trim(),country=$('#fCountry').value||inferCountry(`${title} ${body} ${city}`),category=$('#fCategory').value||inferCategory(`${title} ${body}`),products=$('#fProducts').value.split('\n').map(x=>x.trim()).filter(Boolean),images=$('#fImages').value.split('\n').map(x=>x.trim()).filter(Boolean),tags=$('#fTags').value.split(',').map(x=>x.trim()).filter(Boolean),productImages={};products.forEach((p,idx)=>{if(images[idx])productImages[p]=images[idx]});const obj=normalizeItem({...(item||{}),id:item?.id||uid(),title,body,city,country,category,products,images,productImages,tags,platform:$('#fPlatform').value,url:$('#fUrl').value.trim(),shoppingType:$('#fShoppingType').value.trim(),note:$('#fNote').value,address:extractAddress(body),summary:body.replace(/\s+/g,' ').slice(0,150),terms:uniq([title,...products,...tags]).slice(0,15),createdAt:item?.createdAt||Date.now()});if(item)Object.assign(item,obj);else data.items.unshift(obj);save();closeModal();render()}}
function openShoppingListModal(ids,presetProducts=null){
 const arts=ids.map(id=>data.items.find(x=>x.id===id)).filter(Boolean),m={};
 arts.forEach(a=>{
   const ps=(a.products||[]).length?a.products:[a.title];
   ps.forEach((p,idx)=>{
     if(presetProducts&&!presetProducts.includes(p))return;
     const k=norm(p);
     if(!m[k])m[k]={key:k,name:p,country:a.country,sourceCount:0,qty:1,done:false,image:productImage(a,p,idx)};
     m[k].sourceCount++
   })
 });
 const arr=Object.values(m),hasExisting=data.shoppingLists.length>0;
 openModal(`<div class="sheetHead"><strong>加入購物清單</strong><button class="iconBtn uiBtn" id="closeModal">×</button></div>
 <form class="form" id="shopForm">
   <div class="listChoice">
     <button type="button" class="choiceBtn uiBtn active" data-shopmode="new">新建清單</button>
     <button type="button" class="choiceBtn uiBtn" data-shopmode="existing" ${hasExisting?'':'disabled'}>加入既有</button>
   </div>
   <div id="newShopFields"><label>清單名稱<input id="shopName" value="${esc((arts[0]?.country||'')+' 購物清單')}"></label></div>
   <div id="existingShopFields" class="hidden"><label>選擇清單<select id="existingShop">${data.shoppingLists.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label></div>
   <div class="detailSection"><h4>選擇要加入的商品</h4><div class="shopSelectItems">${arr.map((x,idx)=>`<label class="shopSelectItem">${x.image?`<img src="${esc(x.image)}" alt="">`:'<span class="shopSelectPh">無圖</span>'}<input type="checkbox" class="shopPick" data-idx="${idx}" checked><span><strong>${esc(x.name)}</strong><small>${x.sourceCount>1?`${x.sourceCount} 篇共同提到`:esc(x.country)}</small></span></label>`).join('')}</div></div>
   <div class="formActions"><button type="button" class="ghost uiBtn" id="cancelShop">取消</button><button class="primary uiBtn">確認加入</button></div>
 </form>`);
 let mode='new';
 $('#closeModal').onclick=$('#cancelShop').onclick=closeModal;
 $$('[data-shopmode]').forEach(b=>b.onclick=()=>{if(b.disabled)return;mode=b.dataset.shopmode;$$('[data-shopmode]').forEach(x=>x.classList.toggle('active',x===b));$('#newShopFields').classList.toggle('hidden',mode!=='new');$('#existingShopFields').classList.toggle('hidden',mode!=='existing')});
 $('#shopForm').onsubmit=e=>{
   e.preventDefault();
   const chosen=$$('.shopPick').filter(x=>x.checked).map(x=>arr[+x.dataset.idx]);
   if(!chosen.length){alert('請至少勾選一個商品');return}
   if(mode==='existing'){
     const target=data.shoppingLists.find(x=>x.id===$('#existingShop').value);if(!target)return;
     const exist=new Map(target.items.map(x=>[norm(x.name),x]));
     chosen.forEach(x=>{const k=norm(x.name);if(exist.has(k)){const old=exist.get(k);old.sourceCount=Math.max(old.sourceCount||1,x.sourceCount||1);if(!old.image&&x.image)old.image=x.image}else target.items.push({...x})});
   }else{
     const name=$('#shopName').value.trim();if(!name)return;
     data.shoppingLists.unshift({id:uid(),name,createdAt:Date.now(),items:chosen.map(x=>({...x}))});
   }
   selected.clear();save();closeModal();view='lists';listMode='shopping';render()
 }
}
function openTravelPlanModal(ids){const arts=ids.map(id=>data.items.find(x=>x.id===id)).filter(Boolean);openModal(`<div class="sheetHead"><strong>建立旅遊行程</strong><button class="iconBtn" id="closeModal">×</button></div><form class="form" id="tripForm"><label>行程名稱<input id="tripName" required value="${esc((arts[0]?.country||'')+' 旅遊行程')}"></label><div class="detailSection"><h4>已選收藏</h4>${arts.map(i=>`<div class="tripItem">${i.images?.[0]?`<img class="tripThumb" src="${esc(i.images[0])}">`:'<span class="tripThumb"></span>'}<div><div class="tripTitle">${esc(i.title)}</div><div class="tripMeta">${esc(i.country)}${i.city?` · ${esc(i.city)}`:''}</div></div></div>`).join('')}</div><div class="formActions"><button type="button" class="ghost" id="cancelTrip">取消</button><button class="primary">建立</button></div></form>`);$('#closeModal').onclick=$('#cancelTrip').onclick=closeModal;$('#tripForm').onsubmit=e=>{e.preventDefault();data.travelPlans.unshift({id:uid(),name:$('#tripName').value.trim(),createdAt:Date.now(),items:arts.map(i=>i.id)});selected.clear();save();closeModal();view='lists';listMode='travel';render()}}
function editShoppingImage(listId,idx){const l=data.shoppingLists.find(x=>x.id===listId);if(!l)return;const it=l.items[idx];openModal(`<div class="sheetHead"><strong>商品圖片</strong><button class="iconBtn" id="closeModal">×</button></div><form class="form" id="imgForm"><label>圖片網址<input id="imgUrl" value="${esc(it.image||'')}" placeholder="https://…"></label><label style="margin-top:10px">或選擇照片<input id="imgFile" type="file" accept="image/*"></label><div class="formActions"><button type="button" class="ghost" id="cancelImg">取消</button><button class="primary">儲存</button></div></form>`);$('#closeModal').onclick=$('#cancelImg').onclick=closeModal;$('#imgForm').onsubmit=e=>{e.preventDefault();const f=$('#imgFile').files?.[0];if(f){const r=new FileReader();r.onload=()=>{it.image=r.result;save();closeModal();render()};r.readAsDataURL(f)}else{it.image=$('#imgUrl').value.trim();save();closeModal();render()}}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`social-saver-v${VERSION}-backup.json`;a.click();URL.revokeObjectURL(a.href)}
$('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text()),items=Array.isArray(p)?p:(p.items||[]),lists=p.shoppingLists||[],trips=p.travelPlans||[],ids=new Set(data.items.map(x=>x.id));items.map(normalizeItem).filter(i=>!i.isExample).forEach(i=>{if(!ids.has(i.id)){data.items.push(i);ids.add(i.id)}});const li=new Set(data.shoppingLists.map(x=>x.id));lists.forEach(l=>{if(!li.has(l.id)){data.shoppingLists.push(l);li.add(l.id)}});const ti=new Set(data.travelPlans.map(x=>x.id));trips.forEach(t=>{if(!ti.has(t.id)){data.travelPlans.push(t);ti.add(t.id)}});save();alert('匯入完成');render()}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
$('#menuBtn').onclick=openDrawer;$('#addBtn').onclick=()=>openEditor();$$('.bottomBtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
render();
</script>
