let storageOK=true,memory={};
function readStore(k){try{if(storageOK){const v=localStorage.getItem(k);return v?JSON.parse(v):null}}catch(e){storageOK=false}try{return memory[k]?JSON.parse(memory[k]):null}catch{return null}}
function writeStore(k,v){const raw=JSON.stringify(v);try{if(storageOK){localStorage.setItem(k,raw);return true}}catch(e){storageOK=false}memory[k]=raw;return false}
function uid(){return crypto?.randomUUID?.()||("id-"+Date.now()+"-"+Math.random().toString(36).slice(2))}
function inferCountry(t=""){if(/[가-힣]/.test(t)||/서울|부산|제주|올리브영/.test(t))return"韓國";if(/[ぁ-んァ-ン]/.test(t)||/東京|大阪|京都|日本/.test(t))return"日本";if(/台灣|臺灣|台北|新竹|台中|高雄/.test(t))return"台灣";if(/泰國|Bangkok|Thailand/i.test(t))return"泰國";if(/越南|Hanoi|Vietnam/i.test(t))return"越南";return"其他"}
function inferCategory(t=""){for(const [n,r] of [["購物",/購物|必買|藥妝|美妝|百貨|商品|品牌|olive young|올리브영|大創|다이소|shop/i],["美食",/餐廳|咖啡|美食|烤肉|甜點|맛집|카페|restaurant|food/i],["旅遊",/景點|飯店|機場|地鐵|行程|旅遊|hotel|airport|station/i],["設計",/設計|排版|字體|海報|design|font/i],["產品",/產品|規格|型號|model|spec/i],["娛樂",/演唱會|歌手|藝人|concert|콘서트/i]])if(r.test(t))return n;return"其他"}
function extractAddress(t=""){const a=t.split(/[。；;\n]/).map(x=>x.trim()).filter(Boolean);return a.find(x=>/(서울|부산|제주).*(구|로|길)\s*\d*/.test(x))||a.find(x=>/(市|縣).*(區|鄉|鎮|市).*(路|街|巷|號)/.test(x))||""}
function uniq(a){return [...new Set((a||[]).filter(Boolean))]};function norm(s=""){return String(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]+/g," ").trim()};function esc(s=""){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function normalizeItem(i={}){const country=i.country||inferCountry(`${i.title||""} ${i.body||""}`),category=i.category||inferCategory(`${i.title||""} ${i.body||""}`);return{id:i.id||uid(),isExample:!!i.isExample,title:i.title||"未命名收藏",platform:i.platform||"其他",url:i.url||"",body:i.body||"",category,country,city:i.city||"",shoppingType:i.shoppingType||"",address:i.address||extractAddress(i.body||""),products:Array.isArray(i.products)?i.products:[],tags:Array.isArray(i.tags)?i.tags:[],terms:Array.isArray(i.terms)?i.terms:[],images:Array.isArray(i.images)?i.images:[],summary:i.summary||String(i.body||"").slice(0,120),note:i.note||"",createdAt:i.createdAt||Date.now(),status:i.status||(category==="購物"?"想買":"剛收藏")}}
function seed(){return{version:VERSION,items:[],shoppingLists:[],meta:{examplesInitialized:false}}}
function migrate(){let d=readStore(STORE)||seed();d.items=Array.isArray(d.items)?d.items.map(normalizeItem):[];d.shoppingLists=Array.isArray(d.shoppingLists)?d.shoppingLists:[];d.meta=d.meta||{};if(!d.meta.v130ExamplesEnsured){const ids=new Set(d.items.map(x=>x.id));demos.forEach(x=>{if(!ids.has(x.id))d.items.unshift(normalizeItem(x))});d.meta.examplesInitialized=true;d.meta.v130ExamplesEnsured=true}d.version=VERSION;writeStore(STORE,d);return d}
let data=migrate();let view="library",categoryFilter="全部",countryFilter="全部",tagFilter="全部",searchText="",shoppingSelected=new Set(),detailIndex=0,detailIds=[];

function currentPool(){let a=[...data.items].sort((x,y)=>y.createdAt-x.createdAt);if(categoryFilter!=="全部")a=a.filter(i=>i.category===categoryFilter);if(countryFilter!=="全部")a=a.filter(i=>i.country===countryFilter);if(tagFilter!=="全部")a=a.filter(i=>(i.tags||[]).includes(tagFilter));if(searchText){const q=norm(searchText);a=a.filter(i=>norm([i.title,i.body,i.country,i.city,i.category,i.address,...i.tags,...i.products,...i.terms].join(" ")).includes(q))}return a}

function renderLibrary(){const a=currentPool();return a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty">沒有符合條件的收藏。</div>`}
function similarClusters(){const items=data.items,used=new Set(),out=[];for(let a=0;a<items.length;a++){if(used.has(items[a].id))continue;let g=[items[a]];for(let b=a+1;b<items.length;b++){const A=items[a],B=items[b],pa=new Set((A.products||[]).map(norm)),pb=new Set((B.products||[]).map(norm)),shared=[...pa].filter(x=>pb.has(x)).length,tags=(A.tags||[]).filter(x=>(B.tags||[]).includes(x)).length;if(shared>=1||(A.category===B.category&&A.country===B.country&&tags>=2))g.push(B)}if(g.length>1){g.forEach(x=>used.add(x.id));out.push(g)}}return out}
function renderSimilar(){const groups=similarClusters();if(!groups.length)return`<div class="empty">目前沒有偵測到相似文章。</div>`;return`<div class="clusterList">${groups.map(g=>{const m={};g.forEach(i=>(i.products||[]).forEach(p=>{const k=norm(p);m[k]??={name:p,n:0};m[k].n++}));const common=Object.values(m).filter(x=>x.n>1).sort((a,b)=>b.n-a.n);return`<section class="cluster"><div class="clusterTop"><div><div class="clusterTitle">${esc(g[0].country)}・${esc(g[0].category)} 相似內容</div><div class="meta">點小圖可直接打開文章</div></div><span class="count">${g.length} 篇</span></div><div class="common"><div class="commonLabel">共同資訊</div><div class="tagRow">${common.length?common.map(x=>`<span class="tag">${esc(x.name)} × ${x.n}</span>`).join(""):`<span class="tag">主題與標籤相近</span>`}</div></div><div class="miniCards">${g.map(i=>`<button class="miniCard" data-open="${i.id}">${i.images?.[0]?`<img src="${esc(i.images[0])}" alt="">`:`<span class="miniPh"></span>`}<div>${esc(i.title)}</div></button>`).join("")}</div>${g.some(x=>x.category==="購物")?`<div class="formActions"><button class="ghost clusterShop" data-ids="${g.map(x=>x.id).join(",")}">建立購物清單</button></div>`:""}</section>`}).join("")}</div>`}
function renderShopping(){if(!data.shoppingLists.length)return`<div class="empty">還沒有購物清單。<br>在購物文章卡片右下角點 🛒，再從選單建立清單。</div>`;return`<div class="listGrid">${data.shoppingLists.map(l=>`<section class="shopList"><div class="shopHead"><div><div class="shopName">${esc(l.name||"未命名購物清單")}</div><div class="shopMeta">${new Date(l.createdAt||Date.now()).toLocaleDateString("zh-TW")} · ${l.items.length} 項</div></div><button class="smallBtn deleteList" data-id="${l.id}">刪除</button></div><div class="shopItems">${l.items.map((it,idx)=>`<div class="shopItem ${it.done?"done":""}">${it.image?`<img class="shopThumb editShopImg" data-list="${l.id}" data-idx="${idx}" src="${esc(it.image)}" alt="">`:`<button class="thumbAdd editShopImg" data-list="${l.id}" data-idx="${idx}">＋</button>`}<div><label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:6px"><input type="checkbox" class="doneItem" data-list="${l.id}" data-idx="${idx}" ${it.done?"checked":""}><span class="shopItemName">${esc(it.name)}</span></label><div class="shopItemSub">${esc(it.country||"")}${it.sourceCount>1?` · ${it.sourceCount} 篇共同提到`:""}</div></div><div class="qty"><button class="qtyBtn" data-list="${l.id}" data-idx="${idx}" data-d="-1">−</button><span>${it.qty||1}</span><button class="qtyBtn" data-list="${l.id}" data-idx="${idx}" data-d="1">＋</button></div></div>`).join("")}</div></section>`).join("")}</div>`}
function render(){const title=view==="library"?"收藏庫":view==="similar"?"相似彙整":"購物清單";$("#pageTitle").textContent=title;$("#pageHint").textContent=view==="library"?filterSummary():view==="similar"?"重複資訊會集中在一起":"";$("#content").innerHTML=view==="library"?renderLibrary():view==="similar"?renderSimilar():renderShopping();bindContent()}
function filterSummary(){const parts=[];if(categoryFilter!=="全部")parts.push(categoryFilter);if(countryFilter!=="全部")parts.push(countryFilter);if(tagFilter!=="全部")parts.push("#"+tagFilter);return parts.length?parts.join(" › "):"全部文章"}
function bindContent(){$$("[data-open]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-shop]"))return;openDetail(b.dataset.open)});$$('[data-shop]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();shoppingSelected.has(b.dataset.shop)?shoppingSelected.delete(b.dataset.shop):shoppingSelected.add(b.dataset.shop);render()});$$('.clusterShop').forEach(b=>b.onclick=()=>openShoppingListModal(b.dataset.ids.split(',')));$$('.doneItem').forEach(c=>c.onchange=()=>{const l=data.shoppingLists.find(x=>x.id===c.dataset.list);if(l){l.items[+c.dataset.idx].done=c.checked;save();render()}});$$('.qtyBtn').forEach(b=>b.onclick=()=>{const l=data.shoppingLists.find(x=>x.id===b.dataset.list);if(l){const it=l.items[+b.dataset.idx];it.qty=Math.max(1,(it.qty||1)+(+b.dataset.d));save();render()}});$$('.deleteList').forEach(b=>b.onclick=()=>{if(confirm('刪除這個購物清單？')){data.shoppingLists=data.shoppingLists.filter(x=>x.id!==b.dataset.id);save();render()}});$$('.editShopImg').forEach(b=>b.onclick=()=>editShoppingImage(b.dataset.list,+b.dataset.idx))}
function drawerHTML(){const cats=["全部",...uniq(data.items.map(i=>i.category))];const countryBase=categoryFilter==="全部"?data.items:data.items.filter(i=>i.category===categoryFilter),countries=["全部",...uniq(countryBase.map(i=>i.country))];const tagBase=countryBase.filter(i=>countryFilter==="全部"||i.country===countryFilter),tags=["全部",...uniq(tagBase.flatMap(i=>i.tags||[])).slice(0,20)];return`<div class="drawerBackdrop" id="drawerBackdrop"></div><aside class="drawer"><div class="drawerHead"><div><strong>選單</strong><div class="sub">v${VERSION}</div></div><button class="xBtn" id="closeDrawer">×</button></div><div class="navList"><button class="navBtn ${view==="library"?"active":""}" data-view="library">收藏庫</button><button class="navBtn ${view==="similar"?"active":""}" data-view="similar">相似彙整</button><button class="navBtn ${view==="shopping"?"active":""}" data-view="shopping">購物清單</button></div><details open><summary>篩選</summary><div class="filterLevel"><div class="filterLabel">1. 分類</div><div class="chips">${cats.map(x=>`<button class="chip ${categoryFilter===x?"active":""}" data-cat="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>${categoryFilter!=="全部"?`<div class="filterLevel"><div class="filterLabel">2. 國家</div><div class="chips">${countries.map(x=>`<button class="chip ${countryFilter===x?"active":""}" data-country="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`:""}${categoryFilter!=="全部"&&countryFilter!=="全部"?`<div class="filterLevel"><div class="filterLabel">3. 標籤</div><div class="chips">${tags.map(x=>`<button class="chip ${tagFilter===x?"active":""}" data-tag="${esc(x)}">${x==="全部"?"全部":"# "+esc(x)}</button>`).join("")}</div></div>`:""}</details><details><summary>工具與資訊</summary><div class="statsMini"><div class="stat"><b>${data.items.length}</b><div>收藏文章</div></div><div class="stat"><b>${similarClusters().length}</b><div>相似群組</div></div><div class="stat"><b>${data.shoppingLists.length}</b><div>購物清單</div></div><div class="stat"><b>${uniq(data.items.map(i=>i.country)).length}</b><div>國家</div></div></div><div class="toolRow"><button class="smallBtn" id="exportBtn">匯出資料</button><button class="smallBtn" id="importBtn">匯入備份</button><button class="smallBtn" id="loadExamplesBtn">補回範例</button></div></details>${shoppingSelected.size?`<details open><summary>此次購物</summary><div class="toolRow"><button class="primary" id="makeSelectedList">用已選 ${shoppingSelected.size} 篇建立清單</button><button class="smallBtn" id="clearSelected">清除選取</button></div></details>`:""}</aside>`}
function openDrawer(){$("#drawerRoot").innerHTML=drawerHTML();$("#closeDrawer").onclick=closeDrawer;$("#drawerBackdrop").onclick=closeDrawer;$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;closeDrawer();render()});$$('[data-cat]').forEach(b=>b.onclick=()=>{categoryFilter=b.dataset.cat;countryFilter='全部';tagFilter='全部';openDrawer();render()});$$('[data-country]').forEach(b=>b.onclick=()=>{countryFilter=b.dataset.country;tagFilter='全部';openDrawer();render()});$$('[data-tag]').forEach(b=>b.onclick=()=>{tagFilter=b.dataset.tag;openDrawer();render()});if($('#makeSelectedList'))$('#makeSelectedList').onclick=()=>openShoppingListModal([...shoppingSelected]);if($('#clearSelected'))$('#clearSelected').onclick=()=>{shoppingSelected.clear();openDrawer();render()};if($('#exportBtn'))$('#exportBtn').onclick=exportData;if($('#importBtn'))$('#importBtn').onclick=()=>$('#importFile').click();if($('#loadExamplesBtn'))$('#loadExamplesBtn').onclick=()=>{const ids=new Set(data.items.map(i=>i.id));demos.forEach(d=>{if(!ids.has(d.id))data.items.unshift(normalizeItem(d))});save();openDrawer();render()}}
function closeDrawer(){$("#drawerRoot").innerHTML=""}
function openModal(html){$("#modalRoot").innerHTML=`<div class="modalBackdrop" id="modalBackdrop"><section class="sheet">${html}</section></div>`;$("#modalBackdrop").onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()}}
function closeModal(){$("#modalRoot").innerHTML=""}
function detailOrder(){return currentPool().length?currentPool():[...data.items].sort((a,b)=>b.createdAt-a.createdAt)}
function openDetail(id){detailIds=detailOrder().map(i=>i.id);detailIndex=Math.max(0,detailIds.indexOf(id));renderDetail()}
function renderDetail(){const id=detailIds[detailIndex],i=data.items.find(x=>x.id===id);if(!i)return closeModal();const img=i.images?.[0]||"",q=encodeURIComponent(i.address||i.title),nq=encodeURIComponent(`${i.title} ${i.address||""}`);openModal(`<div class="sheetHead"><strong>${detailIndex+1} / ${detailIds.length}</strong><div class="headActions"><button class="iconBtn" id="editDetail">✎</button><button class="iconBtn danger" id="deleteDetail">⌫</button><button class="iconBtn" id="closeModal">×</button></div></div><div class="detailHero">${img?`<img src="${esc(img)}" alt="">`:""}<div class="detailNav"><button class="navArrow" id="prevDetail">‹</button><button class="navArrow" id="nextDetail">›</button></div><div class="counter">左右切換文章</div></div><div class="detailBody"><h2 class="detailTitle">${esc(i.title)}</h2><div class="detailMeta">${esc(i.platform)} · ${esc(i.category)} · ${esc(i.country)}${i.city?` · ${esc(i.city)}`:""}</div>${i.url?`<div class="detailSection"><a class="linkPill" href="${esc(i.url)}" target="_blank" rel="noopener">↗ 開啟原文章</a></div>`:""}<div class="detailSection"><h4>整理摘要</h4><div class="bodyText">${esc(i.summary)}</div></div>${i.products?.length?`<div class="detailSection"><h4>文章提到的商品</h4><div class="tagRow">${i.products.map(p=>`<span class="tag">${esc(p)}</span>`).join("")}</div></div>`:""}${i.address?`<div class="detailSection"><h4>地點</h4><div class="bodyText">${esc(i.address)}</div><a class="linkPill" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank">Google Maps</a>${i.country==='韓國'?`<a class="linkPill" href="https://map.naver.com/p/search/${nq}" target="_blank">NAVER Map</a>`:""}</div>`:""}<div class="detailSection"><h4>可搜尋文字</h4><div class="tagRow">${(i.terms||[]).map(t=>`<button class="termBtn" data-copy="${esc(t)}">${esc(t)} ⧉</button>`).join("")}</div></div><div class="detailSection"><h4>標籤</h4><div class="tagRow">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div><div class="detailSection noteBox"><h4>我的備註</h4><textarea id="noteInput" placeholder="自己的想法、是否值得去、下次要買什麼…">${esc(i.note||"")}</textarea><div class="formActions"><button class="ghost" id="saveNote">儲存備註</button></div></div><div class="detailSection"><h4>原始文章內容</h4><div class="bodyText">${esc(i.body)}</div></div></div>`);$('#closeModal').onclick=closeModal;$('#editDetail').onclick=()=>openEditor(i.id);$('#deleteDetail').onclick=()=>{if(confirm('確定刪除這篇收藏？')){data.items=data.items.filter(x=>x.id!==i.id);shoppingSelected.delete(i.id);save();detailIds=detailIds.filter(x=>x!==i.id);if(!detailIds.length){closeModal();render()}else{detailIndex=Math.min(detailIndex,detailIds.length-1);renderDetail();render()}}};$('#prevDetail').onclick=()=>{detailIndex=(detailIndex-1+detailIds.length)%detailIds.length;renderDetail()};$('#nextDetail').onclick=()=>{detailIndex=(detailIndex+1)%detailIds.length;renderDetail()};$('#saveNote').onclick=()=>{i.note=$('#noteInput').value;save();$('#saveNote').textContent='已儲存 ✓'};$$('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已複製 ✓'}catch{prompt('複製這段文字',b.dataset.copy)}});let sx=null;$('.detailHero').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('.detailHero').addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55){detailIndex=d<0?(detailIndex+1)%detailIds.length:(detailIndex-1+detailIds.length)%detailIds.length;renderDetail()}sx=null},{passive:true})}
function editorHTML(item){const edit=!!item;return`<div class="sheetHead"><strong>${edit?'編輯收藏':'收藏文章'}</strong><button class="iconBtn" id="closeModal">×</button></div><form class="form" id="editorForm"><div class="formGrid"><label class="full">文章網址<input id="fUrl" type="url" value="${esc(item?.url||'')}" placeholder="https://…"></label><label>平台<select id="fPlatform">${['Instagram','Threads','Facebook','小紅書','YouTube','TikTok','X','網頁','其他'].map(x=>`<option ${item?.platform===x?'selected':''}>${x}</option>`).join('')}</select></label><label>標題<input id="fTitle" required value="${esc(item?.title||'')}"></label><label>分類<select id="fCategory">${['自動判斷','購物','美食','旅遊','設計','產品','娛樂','其他'].map(x=>`<option value="${x==='自動判斷'?'':x}" ${item?.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label>國家<select id="fCountry">${['自動判斷','韓國','日本','台灣','泰國','越南','其他'].map(x=>`<option value="${x==='自動判斷'?'':x}" ${item?.country===x?'selected':''}>${x}</option>`).join('')}</select></label><label>城市 / 區域<input id="fCity" value="${esc(item?.city||'')}"></label><label>購物類型<input id="fShoppingType" value="${esc(item?.shoppingType||'')}"></label><label class="full">文章內容<textarea id="fBody" rows="6">${esc(item?.body||'')}</textarea></label><label class="full">商品（每行一個）<textarea id="fProducts" rows="4">${esc((item?.products||[]).join('\n'))}</textarea></label><label class="full">圖片網址（每行一個）<textarea id="fImages" rows="3">${esc((item?.images||[]).join('\n'))}</textarea></label><label class="full">標籤（逗號分隔）<input id="fTags" value="${esc((item?.tags||[]).join(', '))}"></label><label class="full">備註<textarea id="fNote" rows="3">${esc(item?.note||'')}</textarea></label></div><div class="formActions"><button type="button" class="ghost" id="cancelEdit">取消</button><button class="primary">${edit?'儲存修改':'加入收藏'}</button></div></form>`}
function openEditor(id=null){const item=id?data.items.find(x=>x.id===id):null;openModal(editorHTML(item));$('#closeModal').onclick=$('#cancelEdit').onclick=closeModal;$('#editorForm').onsubmit=e=>{e.preventDefault();const title=$('#fTitle').value.trim(),body=$('#fBody').value.trim(),city=$('#fCity').value.trim(),country=$('#fCountry').value||inferCountry(`${title} ${body} ${city}`),category=$('#fCategory').value||inferCategory(`${title} ${body}`),products=$('#fProducts').value.split('\n').map(x=>x.trim()).filter(Boolean),images=$('#fImages').value.split('\n').map(x=>x.trim()).filter(Boolean),tags=$('#fTags').value.split(',').map(x=>x.trim()).filter(Boolean);const obj=normalizeItem({...(item||{}),id:item?.id||uid(),title,body,city,country,category,products,images,tags,platform:$('#fPlatform').value,url:$('#fUrl').value.trim(),shoppingType:$('#fShoppingType').value.trim(),note:$('#fNote').value,address:extractAddress(body),summary:body.replace(/\s+/g,' ').slice(0,130),terms:uniq([title,...products,...tags]).slice(0,12),createdAt:item?.createdAt||Date.now()});if(item)Object.assign(item,obj);else data.items.unshift(obj);save();closeModal();render()}}
function openShoppingListModal(ids){const arts=ids.map(id=>data.items.find(x=>x.id===id)).filter(Boolean),m={};arts.forEach(a=>(a.products||[]).forEach(p=>{const k=norm(p);if(!m[k])m[k]={name:p,country:a.country,sourceCount:0,qty:1,done:false,image:a.images?.[0]||''};m[k].sourceCount++}));const arr=Object.values(m);openModal(`<div class="sheetHead"><strong>建立購物清單</strong><button class="iconBtn" id="closeModal">×</button></div><form class="form" id="shopForm"><label>清單名稱<input id="shopName" required value="${esc((arts[0]?.country||'')+' 購物清單')}"></label><div class="detailSection"><h4>品項預覽</h4><div class="shopItems">${arr.map(x=>`<div class="shopItem">${x.image?`<img class="shopThumb" src="${esc(x.image)}">`:`<span class="thumbAdd">＋</span>`}<div><div class="shopItemName">${esc(x.name)}</div><div class="shopItemSub">${x.sourceCount>1?`${x.sourceCount} 篇共同提到`:''}</div></div><span></span></div>`).join('')||'沒有可加入的商品'}</div></div><div class="formActions"><button type="button" class="ghost" id="cancelShop">取消</button><button class="primary" ${arr.length?'':'disabled'}>建立</button></div></form>`);$('#closeModal').onclick=$('#cancelShop').onclick=closeModal;$('#shopForm').onsubmit=e=>{e.preventDefault();data.shoppingLists.unshift({id:uid(),name:$('#shopName').value.trim(),createdAt:Date.now(),items:arr});shoppingSelected.clear();save();closeModal();view='shopping';render()}}
function editShoppingImage(listId,idx){const l=data.shoppingLists.find(x=>x.id===listId);if(!l)return;const it=l.items[idx];openModal(`<div class="sheetHead"><strong>商品圖片</strong><button class="iconBtn" id="closeModal">×</button></div><form class="form" id="imgForm"><label>圖片網址<input id="imgUrl" value="${esc(it.image||'')}" placeholder="https://…"></label><label style="margin-top:10px">或選擇照片<input id="imgFile" type="file" accept="image/*"></label><div class="formActions"><button type="button" class="ghost" id="cancelImg">取消</button><button class="primary">儲存</button></div></form>`);$('#closeModal').onclick=$('#cancelImg').onclick=closeModal;$('#imgForm').onsubmit=e=>{e.preventDefault();const file=$('#imgFile').files?.[0];if(file){const r=new FileReader();r.onload=()=>{it.image=r.result;save();closeModal();render()};r.readAsDataURL(file)}else{it.image=$('#imgUrl').value.trim();save();closeModal();render()}}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`social-saver-v${VERSION}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text()),items=Array.isArray(p)?p:(p.items||[]),lists=p.shoppingLists||[],ids=new Set(data.items.map(x=>x.id));items.map(normalizeItem).forEach(i=>{if(!ids.has(i.id)){data.items.push(i);ids.add(i.id)}});const li=new Set(data.shoppingLists.map(x=>x.id));lists.forEach(l=>{if(!li.has(l.id)){data.shoppingLists.push(l);li.add(l.id)}});save();alert('匯入完成');render()}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
$('#menuBtn').onclick=openDrawer;$('#addFab').onclick=()=>openEditor();$('#searchFab').onclick=()=>{$('#searchBar').classList.toggle('hidden');if(!$('#searchBar').classList.contains('hidden'))setTimeout(()=>$('#searchInput').focus(),50)};$('#searchInput').oninput=e=>{searchText=e.target.value;render()};$('#clearSearch').onclick=()=>{$('#searchInput').value='';searchText='';$('#searchBar').classList.add('hidden');render()};
render();
